paths:
  raw: data/raw
  processed: data/processed
  splits: data/splits
  eda: data/eda
  model_artifacts: model_artifacts
  evaluation: data/eda/training
  model_cards: model_cards
preprocessing:
  age_bins:
  - 0
  - 18
  - 45
  - 65
  - 75
  - 120
  age_labels:
  - 0-17
  - 18-44
  - 45-64
  - 65-74
  - 75+
  unknown_age_label: unknown
  target_column: is_serious
  serious_outcome_codes:
  - DE
  - HO
  - DS
  - LT
  - OT
  categorical_features:
  - sex
  - route
  - age_group
  - drug_name_normalized
  numerical_features:
  - polypharmacy_count
  drug_fuzzy_threshold: 85
splitting:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  random_state: 42
training:
  scale_pos_weight: 0.38
  threshold: 0.24
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.1
  random_state: 42
  eval_metric: aucpr
  early_stopping_rounds: 30
  threshold_strategy: f1
  min_precision: 0.3
mlflow:
  tracking_uri: mlruns
  experiment_name: PharmaGuard-ADR-Detection
  enabled: true
api:
  host: 0.0.0.0
  port: 8000
  model_version: v3
