# ==============================================================
# PharmaGuard — CI Pipeline (GitHub Actions)
# ==============================================================
# Runs on every push to main and every pull request.
#
# Steps:
#   1. Check out code
#   2. Set up Python 3.11
#   3. Cache pip dependencies (faster builds)
#   4. Install dependencies
#   5. Verify clean imports (no circular dependencies)
#   6. Run the full pytest test suite
# ==============================================================

name: CI — Tests & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      # ── 1. Check out the repository ───────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── 3. Cache pip dependencies ─────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 5. Verify clean imports ───────────────────────────────
      - name: Verify module imports
        run: |
          python -c "from src.api.schemas import PredictionRequest, PredictionResponse"
          python -c "from src.api.app import create_app"
          python -c "from src.tracking.metrics_store import load_metrics_history"
          echo "✅ All imports clean"

      # ── 6. Run pytest ─────────────────────────────────────────
      - name: Run test suite
        run: |
          pytest tests/ -v --tb=short --no-header -q
